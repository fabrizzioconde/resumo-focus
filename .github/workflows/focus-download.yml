name: Download Focus BCB

on:
  schedule:
    - cron: "15 12 * * 1"   # segunda-feira às 12h15 UTC = 9h15 BRT (UTC-3)
  workflow_dispatch:         # permite disparo manual pela UI do GitHub

# Desde fev/2023 o GITHUB_TOKEN vem somente leitura por padrão em repos novos;
# sem isso o "git push" do último passo é recusado com 403.
permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar PDF do Focus
        run: python src/baixar_focus.py

      - name: Extrair texto do PDF
        run: python src/extrair_texto.py

      - name: Commitar arquivos gerados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/focus_*.pdf data/focus_*.txt
          # --quiet faz o diff falhar silenciosamente se não houver mudança;
          # o || true impede que o step falhe nesse caso
          git diff --cached --quiet || \
            git commit -m "chore: Focus $(date -u +%Y-%m-%d) [skip ci]"
          git push
