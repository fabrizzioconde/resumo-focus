name: Download Focus BCB

on:
  schedule:
    # O agendamento do GitHub Actions é best-effort (atrasa ou até descarta
    # execuções). Disparamos em vários horários como redundância; o envio de
    # e-mail é idempotente (só sai quando um resumo NOVO é criado), então as
    # execuções extras não geram e-mail duplicado.
    - cron: "30 11 * * 1"   # seg 08h30 BRT — logo após a publicação do Focus
    - cron: "30 14 * * 1"   # seg 11h30 BRT — reforço caso o 1º atrase/não dispare
    - cron: "30 11 * * 2"   # ter 08h30 BRT — rede de segurança se a segunda falhar
  workflow_dispatch:         # permite disparo manual pela UI do GitHub

# Desde fev/2023 o GITHUB_TOKEN vem somente leitura por padrão em repos novos;
# sem isso o "git push" do último passo é recusado com 403.
permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar PDF do Focus
        run: python src/baixar_focus.py

      - name: Extrair texto do PDF
        run: python src/extrair_texto.py

      - name: Gerar resumo executivo
        id: resumo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          saida=$(python src/resumir_focus.py)
          echo "$saida"
          # Idempotência do e-mail: resumir_focus.py imprime "Resumo salvo em:
          # <caminho>" SOMENTE quando cria um arquivo novo; em reexecução já
          # existente imprime "...já existe" e nada deve ser enviado.
          criado=$(echo "$saida" | sed -n 's/^Resumo salvo em: //p')
          if [ -n "$criado" ]; then
            base=$(basename "$criado" .md)        # focus_AAAA-MM-DD
            iso=${base#focus_}                    # AAAA-MM-DD
            br=$(date -u -d "$iso" +%d/%m/%Y)
            {
              echo "enviar=true"
              echo "arquivo=output/focus/${base}.md"
              echo "assunto=Focus BCB — $br"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Nenhum resumo novo criado; pulando envio de e-mail."
            echo "enviar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commitar arquivos gerados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/focus_*.pdf data/focus_*.txt output/focus/focus_*.md
          # --quiet faz o diff falhar silenciosamente se não houver mudança;
          # o || true impede que o step falhe nesse caso
          git diff --cached --quiet || \
            git commit -m "chore: Focus $(date -u +%Y-%m-%d) [skip ci]"
          git push

      # Envio automático do resumo, sem revisão humana. Complementa (não
      # substitui) a rotina local que cria o rascunho no Gmail. O gating de
      # envio (idempotente) é definido no passo "Gerar resumo executivo".
      - name: Enviar resumo por e-mail
        if: steps.resumo.outputs.enviar == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Boletim Focus <${{ secrets.GMAIL_USERNAME }}>
          to: claude.projetos.ai@gmail.com
          subject: ${{ steps.resumo.outputs.assunto }}
          body: file://${{ steps.resumo.outputs.arquivo }}
          convert_markdown: true
